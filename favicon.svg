<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: off-white paper -->
  <rect width="32" height="32" rx="4" fill="#f5f3ee"/>
  <!-- Violet brushstroke accent behind the K -->
  <ellipse cx="16" cy="19" rx="13" ry="5" fill="#9b3fa6" opacity="0.22" transform="rotate(-8 16 19)"/>
  <!-- K letterform -->
  <text x="5" y="25" font-family="Georgia, serif" font-size="24" font-weight="700"
        fill="#1a1a18" letter-spacing="-1">K</text>
  <!-- W letterform -->
  <text x="17" y="25" font-family="Georgia, serif" font-size="16" font-weight="400"
        fill="#9b3fa6" letter-spacing="-1">W</text>
</svg>